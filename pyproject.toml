[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "notification-sound-db"
version = "0.1.0"
description = "Reproducible loudness and spectral measurements for notification sounds"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "notification-sound-db contributors"}]
dependencies = [
  "jinja2>=3.1",
  "jsonschema>=4.21",
  "numpy>=1.26",
  "scipy>=1.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.9",
]

[project.scripts]
notification-sound-db = "notification_sound_db.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
