version: 2
# Every entry runs every day at 00:00 JST on a cron schedule; `interval: daily`
# runs on weekdays only.
updates:
  # Python dependencies (pyproject.toml and requirements.txt).
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: cron
      cronjob: "0 0 * * *"
      timezone: "Asia/Tokyo"
  # The actions the workflows use.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: cron
      cronjob: "0 0 * * *"
      timezone: "Asia/Tokyo"
