name: Deploy Pages

# Builds the report on every pull request and on a manual run of this workflow, without publishing it. Publishes it
# after Validate (test.yml) passes on main, for a push or a manual run of Validate: from the commit Validate tested,
# and only while that commit is still the tip of main, so a Validate run that finishes late does not publish an older
# report over a newer one.
on:
  pull_request:
  workflow_run:
    workflows: [Validate]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event_name != 'workflow_run' || (
        github.event.workflow_run.conclusion == 'success'
        && (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')
        && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      publish: ${{ steps.tip.outputs.publish }}
    steps:
      - name: Check the tested commit is the tip of main
        id: tip
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED: ${{ github.event.workflow_run.head_sha }}
        run: |
          tip=$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)
          if [ "${tip}" = "${TESTED}" ]; then
            echo "publish=true" >> "${GITHUB_OUTPUT}"
          else
            echo "::notice::main is at ${tip}, past ${TESTED} that Validate tested; the run for ${tip} publishes"
            echo "publish=false" >> "${GITHUB_OUTPUT}"
          fi
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Install hash-locked dependencies
        timeout-minutes: 10
        run: python -m pip install --require-hashes --no-deps -r requirements.txt
      - name: Validate canonical data
        env:
          PYTHONPATH: src
        run: python -m notification_sound_db validate
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - name: Build static report
        env:
          PYTHONPATH: src
          SITE_URL: https://notification-sound-db.semnil.com
        run: python -m notification_sound_db build-site
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: site

  deploy:
    if: needs.build.outputs.publish == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
