name: Deploy Pages

# Builds the report on every pull request and on a manual run of this workflow, without publishing it. Publishes it
# after Validate (test.yml) passes on main, for a push or a manual run of Validate, when the commit Validate tested is
# the last commit on main as the workflow_run event names it (GITHUB_SHA): that commit is the one checked out, and a
# Validate run that finishes after main moved on builds nothing. Only the runs that publish share the concurrency group
# pages (one running, the newest waiting); every other run has a group of its own, so it cancels no pending publish.
# The publish condition is written twice, in the group and in the build job, and .github/tests/pages-test.sh holds the
# two to the same text.
on:
  pull_request:
  workflow_run:
    workflows: [Validate]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: >-
    ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.ref) || (
      github.event_name == 'workflow_run'
      && github.event.workflow_run.conclusion == 'success'
      && (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')
      && github.event.workflow_run.head_repository.full_name == github.repository
      && github.sha == github.event.workflow_run.head_sha) && 'pages' || format('pages-run-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event_name != 'workflow_run' || (
        github.event.workflow_run.conclusion == 'success'
        && (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')
        && github.event.workflow_run.head_repository.full_name == github.repository
        && github.sha == github.event.workflow_run.head_sha)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Install hash-locked dependencies
        timeout-minutes: 10
        run: python -m pip install --require-hashes --no-deps -r requirements.txt
      - name: Validate canonical data
        env:
          PYTHONPATH: src
        run: python -m notification_sound_db validate
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Build static report
        env:
          PYTHONPATH: src
          SITE_URL: https://notification-sound-db.semnil.com
        run: python -m notification_sound_db build-site
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    if: github.event_name == 'workflow_run'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
