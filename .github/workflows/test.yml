name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg
      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'
      - name: Lint
        run: ruff check .
      - name: Test
        run: |
          pytest
          node --test tests/test_language.mjs
      - name: Validate canonical data
        run: notification-sound-db validate
      - name: Check generated files
        env:
          SITE_URL: https://notification-sound-db.semnil.com
        run: |
          notification-sound-db export
          notification-sound-db build-site
          git diff --exit-code -- data/exports site
