name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Install FFmpeg
        timeout-minutes: 40
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg
      - name: Install project
        timeout-minutes: 10
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'
      - name: Lint
        run: ruff check .
      - name: Test
        run: |
          pytest
          node --test tests/test_language.mjs
      - name: Validate canonical data
        run: notification-sound-db validate
      - name: Check generated files
        env:
          SITE_URL: https://notification-sound-db.semnil.com
        run: |
          notification-sound-db export
          notification-sound-db build-site
          git diff --exit-code -- data/exports site
